<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">JANUS Gate mark</title>
  <desc id="desc">Two intersecting portals around a central axis.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c68"/>
      <stop offset="1" stop-color="#a92634"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70f2c2"/>
      <stop offset="1" stop-color="#3aa889"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="#090d13" stroke="#26303b"/>
  <ellipse cx="43" cy="64" rx="25" ry="39" fill="none" stroke="url(#left)" stroke-width="4"/>
  <ellipse cx="85" cy="64" rx="25" ry="39" fill="none" stroke="url(#right)" stroke-width="4"/>
  <path d="M64 24v80" stroke="#e8eef4" stroke-opacity=".82" stroke-width="2"/>
  <rect x="51" y="51" width="26" height="26" rx="6" transform="rotate(45 64 64)" fill="#090d13" stroke="#dfe8ef" stroke-opacity=".72"/>
  <circle cx="64" cy="64" r="3.5" fill="#f5c768"/>
</svg>
