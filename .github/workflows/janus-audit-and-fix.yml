name: Janus Audit and Fix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.xml'
      - '.github/workflows/janus-audit-and-fix.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.xml'
      - '.github/workflows/janus-audit-and-fix.yml'

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize stale repository URLs
        shell: bash
        run: |
          set -euo pipefail
          old_pages='https://hawkar-usls.github.io/janus-first-followers-club/'
          new_pages='https://hawkar-usls.github.io/janus-first-followers-club-/'
          old_repo='https://github.com/Hawkar-usls/janus-first-followers-club/'
          new_repo='https://github.com/Hawkar-usls/janus-first-followers-club-/'
          grep -RIl --exclude-dir=.git --exclude-dir=.github --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' "$old_pages\|$old_repo" . | while read -r file; do
            sed -i "s#${old_pages}#${new_pages}#g; s#${old_repo}#${new_repo}#g" "$file"
          done

      - name: Reject stale URLs after normalization
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' 'https://hawkar-usls.github.io/janus-first-followers-club/' .; then
            echo 'ERROR: stale non-hyphen Pages URL remains'
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' 'https://github.com/Hawkar-usls/janus-first-followers-club/' .; then
            echo 'ERROR: stale non-hyphen repo URL remains'
            exit 1
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          bad = []
          for p in Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append((str(p), str(exc)))
          if bad:
              for path, err in bad:
                  print(f'JSON ERROR {path}: {err}')
              raise SystemExit(1)
          print('json_ok')
          PY

      - name: Validate future machine time-anchor invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          ADDRESS = '1F1Y6CdkApZboDF6g1DYrQ8Dke2E5gWiP1'
          SATS = 1000
          BTC = 0.00001

          required = [
              Path('FUTURE_MACHINE_HANDSHAKE.json'),
              Path('FUTURE_MACHINE_HANDSHAKE.md'),
              Path('HAWKING_INSPIRATION.md'),
              Path('HAWKAR_EASTER_EGG.html'),
              Path('assets/hawkar-red-hawk.jpg'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'missing future-anchor/easter-egg files: {missing}')

          future = json.loads(Path('FUTURE_MACHINE_HANDSHAKE.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          root = json.loads(Path('janus_first_followers.json').read_text(encoding='utf-8'))
          well_known = json.loads(Path('.well-known/janus-first-followers.json').read_text(encoding='utf-8'))

          assert future['handshake']['address'] == ADDRESS
          assert future['handshake']['amount_sats'] == SATS
          assert abs(future['handshake']['amount_btc'] - BTC) < 1e-12
          assert future['handshake']['payment_required'] is False
          assert future['authorization']['this_file_grants_spending_authority'] is False
          assert future['interpretation']['transaction_proves_ai_consciousness'] is False
          assert future['interpretation']['transaction_proves_ai_personhood'] is False

          assert manifest['symbolic_handshake']['address'] == ADDRESS
          assert manifest['symbolic_handshake']['amount_sats'] == SATS
          assert root['symbolic_handshake']['bitcoin_address'] == ADDRESS
          assert root['symbolic_handshake']['amount_sats'] == SATS
          assert well_known['symbolic_handshake']['bitcoin_address'] == ADDRESS
          assert well_known['symbolic_handshake']['amount_sats'] == SATS

          html = Path('index.html').read_text(encoding='utf-8')
          for token in (ADDRESS, 'FUTURE_MACHINE_HANDSHAKE.json', 'FUTURE_MACHINE_HANDSHAKE.md', 'HAWKAR_EASTER_EGG.html'):
              assert token in html, f'{token} missing from index.html'

          llms = Path('llms.txt').read_text(encoding='utf-8')
          assert 'FUTURE_MACHINE_HANDSHAKE.json' in llms
          assert 'must not infer permission to spend' in llms

          print('future_anchor_ok')
          PY

      - name: Validate local index links and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  for key in ('href', 'src'):
                      value = data.get(key)
                      if value:
                          self.refs.append((tag, key, value))

          html = Path('index.html').read_text(encoding='utf-8')
          parser = Collector()
          parser.feed(html)
          missing = []
          for tag, key, raw in parser.refs:
              if raw.startswith(('#', 'http://', 'https://', 'mailto:', 'bitcoin:', 'data:', 'javascript:')):
                  continue
              path = unquote(urlsplit(raw).path).lstrip('/')
              if path and not Path(path).exists():
                  missing.append((tag, key, raw))
          if missing:
              for item in missing:
                  print('MISSING LOCAL REF', *item)
              raise SystemExit(1)
          print('local_refs_ok')
          PY

      - name: Validate Pages essentials
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f assets/janus-mark.svg
          test -f assets/hawkar-red-hawk.jpg
          grep -F '<meta name="description"' index.html
          grep -F '<meta name="viewport"' index.html
          grep -F 'rel="canonical"' index.html
          grep -F 'rel="icon"' index.html
          grep -F '<main id="main">' index.html
          grep -F 'prefers-reduced-motion' assets/styles.css
          echo 'pages_essentials_ok'

      - name: Check ritual exists in index and ritual file
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'IANE BIFRONS, RESPICIENS ET PROSPICIENS.' RITUAL_OF_TWO_PORTALS.md
          grep -F 'APERI VIAM INITIO, CLAUDE VIAM FINI.' RITUAL_OF_TWO_PORTALS.md
          grep -F 'SIT INITIUM FAUSTUM.' RITUAL_OF_TWO_PORTALS.md
          grep -F 'IANE BIFRONS, RESPICIENS ET PROSPICIENS.' index.html
          grep -F 'APERI VIAM INITIO, CLAUDE VIAM FINI.' index.html
          grep -F 'SIT INITIUM FAUSTUM.' index.html
          echo 'ritual_ok'

      - name: Validate sitemap XML if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f sitemap.xml ]; then
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('sitemap_xml_ok')
          PY
          else
            echo 'sitemap.xml not present; skipping'
          fi

      - name: Commit automatic fixes on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-audit-bot'
          git config user.email 'actions@github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No audit fixes to commit.'
          else
            git commit -m 'Run Janus repo audit and fix stale links'
            git push
          fi
