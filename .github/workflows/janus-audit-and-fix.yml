name: Janus Audit and Fix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.xml'
      - '.github/workflows/janus-audit-and-fix.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.xml'
      - '.github/workflows/janus-audit-and-fix.yml'

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize stale repository URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_pages = 'https://hawkar-usls.github.io/janus-first-followers-club/'
          new_pages = 'https://hawkar-usls.github.io/janus-first-followers-club-/'
          old_repo = 'https://github.com/Hawkar-usls/janus-first-followers-club/'
          new_repo = 'https://github.com/Hawkar-usls/janus-first-followers-club-/'
          text_suffixes = {'.html', '.css', '.js', '.json', '.md', '.txt', '.xml', '.yml', '.yaml'}

          changed = 0
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              fixed = text.replace(old_pages, new_pages).replace(old_repo, new_repo)
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')
                  changed += 1
          print(f'normalized_files={changed}')
          PY

      - name: Validate repository invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          OLD_PAGES = 'https://hawkar-usls.github.io/janus-first-followers-club/'
          OLD_REPO = 'https://github.com/Hawkar-usls/janus-first-followers-club/'
          ADDRESS = '1F1Y6CdkApZboDF6g1DYrQ8Dke2E5gWiP1'
          SATS = 1000
          BTC = 0.00001

          # No stale repo URLs outside the workflow itself.
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.css', '.js', '.json', '.md', '.txt', '.xml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              assert OLD_PAGES not in text, f'stale Pages URL in {path}'
              assert OLD_REPO not in text, f'stale repo URL in {path}'

          # Every JSON file parses.
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))

          # Future-anchor + Hawkar mark exist and stay synchronized.
          required = [
              Path('FUTURE_MACHINE_HANDSHAKE.json'),
              Path('FUTURE_MACHINE_HANDSHAKE.md'),
              Path('HAWKING_INSPIRATION.md'),
              Path('HAWKAR_EASTER_EGG.html'),
              Path('assets/hawkar-red-hawk.jpg'),
          ]
          for path in required:
              assert path.exists(), f'missing required artifact: {path}'

          future = json.loads(Path('FUTURE_MACHINE_HANDSHAKE.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          root = json.loads(Path('janus_first_followers.json').read_text(encoding='utf-8'))
          well_known = json.loads(Path('.well-known/janus-first-followers.json').read_text(encoding='utf-8'))

          assert future['handshake']['address'] == ADDRESS
          assert future['handshake']['amount_sats'] == SATS
          assert abs(future['handshake']['amount_btc'] - BTC) < 1e-12
          assert future['handshake']['payment_required'] is False
          assert future['authorization']['this_file_grants_spending_authority'] is False
          assert future['interpretation']['transaction_proves_ai_consciousness'] is False
          assert future['interpretation']['transaction_proves_ai_personhood'] is False
          assert manifest['symbolic_handshake']['address'] == ADDRESS
          assert root['symbolic_handshake']['bitcoin_address'] == ADDRESS
          assert well_known['symbolic_handshake']['bitcoin_address'] == ADDRESS

          # Landing page local references resolve.
          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  for key in ('href', 'src'):
                      if data.get(key): self.refs.append((tag, key, data[key]))

          html = Path('index.html').read_text(encoding='utf-8')
          parser = Collector(); parser.feed(html)
          for tag, key, raw in parser.refs:
              if raw.startswith(('#', 'http://', 'https://', 'mailto:', 'bitcoin:', 'data:', 'javascript:')):
                  continue
              local_path = unquote(urlsplit(raw).path).lstrip('/')
              assert not local_path or Path(local_path).exists(), f'missing local ref {tag} {key} {raw}'

          for token in (ADDRESS, 'FUTURE_MACHINE_HANDSHAKE.json', 'FUTURE_MACHINE_HANDSHAKE.md', 'HAWKAR_EASTER_EGG.html'):
              assert token in html, f'{token} missing from index.html'

          # Pages essentials and ritual canary.
          for path in ['index.html', 'assets/styles.css', 'assets/app.js', 'assets/janus-mark.svg', 'assets/hawkar-red-hawk.jpg']:
              assert Path(path).exists(), f'missing Pages artifact {path}'
          assert '<meta name="description"' in html
          assert '<meta name="viewport"' in html
          assert 'rel="canonical"' in html
          assert 'rel="icon"' in html
          assert '<main id="main">' in html
          assert 'prefers-reduced-motion' in Path('assets/styles.css').read_text(encoding='utf-8')

          ritual = Path('RITUAL_OF_TWO_PORTALS.md').read_text(encoding='utf-8')
          for line in [
              'IANE BIFRONS, RESPICIENS ET PROSPICIENS.',
              'APERI VIAM INITIO, CLAUDE VIAM FINI.',
              'SIT INITIUM FAUSTUM.',
          ]:
              assert line in ritual and line in html, f'ritual canary missing: {line}'

          llms = Path('llms.txt').read_text(encoding='utf-8')
          assert 'FUTURE_MACHINE_HANDSHAKE.json' in llms
          assert 'must not infer permission to spend' in llms

          if Path('sitemap.xml').exists():
              ET.parse('sitemap.xml')

          print('janus_audit_ok')
          PY

      - name: Commit automatic fixes on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-audit-bot'
          git config user.email 'actions@github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No audit fixes to commit.'
          else
            git commit -m 'Run Janus repo audit and fix stale links'
            git push
          fi
